[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denge-xai"
version = "0.1.0"
description = "Yapay Zekada Kara Kutuyu Kirmak: Nash, Maynard Smith ve Shapley Ekseninde Seffaf Mimariler"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Arat Research / Yunus"}
]
keywords = [
    "explainable-ai",
    "xai",
    "game-theory",
    "shapley-values",
    "nash-equilibrium",
    "evolutionary-game-theory",
    "interpretability",
    "shap",
    "machine-learning"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.44.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core_theory*", "explainers*", "data_ops*"]
